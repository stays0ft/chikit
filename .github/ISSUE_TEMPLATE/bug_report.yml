name: Bug report
description: Something in Chikit does not work as expected
labels:
  - bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of Chikit?
      options:
        - Window layout
        - Cleaner / Uninstaller
        - Notch media controls
        - Quit on close
        - Clipboard history
        - Finder rename
        - File converter
        - Volume mixer / Output switcher
        - Screen recorder
        - System monitor
        - Fan control
        - Menu bar panel / Settings
        - Something else
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.1, MacBook Pro 14-inch (M3)
    validations:
      required: true
  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions
      options:
        - label: If a feature does nothing, I checked that Chikit is listed and switched on under System Settings, Privacy and Security, and toggled it off and on again.
